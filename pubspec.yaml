name: math_scanner_ai
description: Math Scanner AI - Scan math problems, get step-by-step solutions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image_picker: ^1.0.7
  dio: ^5.4.1
  google_mlkit_text_recognition: ^0.13.0
  image_cropper: ^5.0.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_math_fork: ^0.7.2
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

